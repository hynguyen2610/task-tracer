<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Task Tracker</title>
    <meta name="description" content="Track time on your tasks and write the daily report. Data stays on this device." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tasks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // The saved theme (docs/SPEC.md 15), before the first paint; see src/theme/themes.ts.
      try {
        var bars = { classic: "#4f46e5", midnight: "#0a0f1e", notebook: "#eee6d2", terminal: "#000000", zen: "#f4efe4" };
        var theme = localStorage.getItem("theme");
        if (bars[theme]) {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", bars[theme]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
